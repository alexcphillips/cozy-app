version: "3.8"

services:
    db:
        image: postgres:15-alpine
        container_name: postgres-db
        restart: always
        environment:
            POSTGRES_DB: cozy_apps
            POSTGRES_USER: postgres_admin
            POSTGRES_PASSWORD: pw123ldascsdcdasdfas
        volumes:
            - postgres_data:/var/lib/postgresql/data
        ports:
            - "5432:5432"

    api:
        build:
            context: .
            dockerfile: server/Dockerfile
        container_name: express-api
        restart: always
        ports:
            - "8080:8080"
        env_file:
            - server/.env
        depends_on:
            - db
        links:
            - db

volumes:
    postgres_data:
